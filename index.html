<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .apps {
      display: grid;
      gap: 12px;
    }

    .app {
      display: block;
      padding: 18px 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-decoration: none;
      color: #111;
      transition: 0.2s ease;
    }

    .app:hover {
      transform: translateY(-2px);
      border-color: #999;
    }

    .app-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .app-description {
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>My Hub</h1>
    <p class="subtitle">I miei progetti e applicazioni web</p>

    <div id="apps" class="apps"></div>
  </main>

  <script>
    /*
      =====================================================
      INSERISCI QUI LE TUE APPLICAZIONI
      =====================================================

      Per aggiungere una nuova applicazione copia questo
      formato e modifica nome, descrizione e link.

      Esempio:

      {
        name: "Nome Applicazione",
        description: "Breve descrizione",
        url: "https://tuolink.com"
      }
    */

    const apps = [
      {
        name: "HelpoHotel",
        description: "Gestione e analisi delle problematiche degli hotel",
        url: "https://example.com"
      },

      {
        name: "Coach Soccer Lab",
        description: "Piattaforma per la gestione e analisi calcistica",
        url: "https://example.com"
      }

      // Aggiungi qui altre applicazioni...
    ];

    const appsContainer = document.getElementById("apps");

    apps.forEach(app => {
      const link = document.createElement("a");

      link.className = "app";
      link.href = app.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      link.innerHTML = `
        <div class="app-name">${app.name}</div>
        <div class="app-description">${app.description}</div>
      `;

      appsContainer.appendChild(link);
    });
  </script>

</body>
</html>
