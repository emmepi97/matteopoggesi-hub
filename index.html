<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .apps {
      display: grid;
      gap: 12px;
    }

    .app {
      display: block;
      padding: 18px 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-decoration: none;
      color: #111;
      transition: 0.2s ease;
    }

    .app:hover {
      transform: translateY(-2px);
      border-color: #999;
    }

    .app-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .app-description {
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>My Hub</h1>
    <p class="subtitle">I miei progetti e applicazioni web</p>

    <div id="apps" class="apps"></div>
  </main>

  <script>
    /*
      =====================================================
      INSERISCI QUI LE TUE APPLICAZIONI
      =====================================================

      Per aggiungere una nuova applicazione copia questo
      formato e modifica nome, descrizione e link.

      Esempio:

      {
        name: "Nome Applicazione",
        description: "Breve descrizione",
        url: "https://tuolink.com"
      }
    */

    const apps = [
      {
        name: "MrSoccerGamification",
        description: "Gestione squadra di calcio e gamificazione allenamenti",
        url: "https://matteopoggesi08.github.io/mrsoccergamification/#/"
      }

      

      ,{
        name: "Player Lab Ultimate",
        description: "Monitoraggio della propria carriera calcistica",
        url: "https://emmepi97.github.io/playerlab-ultimate/"
      }

    
     , {
        name: "Football Career",
        description: "NON FUNZIONA PIU DA CAPIRE PERCHE E COSA FACESSE",
        url: "https://emmepi97.github.io/footballercareer/"
      }

    
      ,{
        name: "Coach Soccer",
        description: "Monitoraggio carichi di lavoro e presenze calcio",
        url: "https://emmepi97.github.io/coachsoccer/"
      }

    
     , {
        name: "Player Lab Ultimate ",
        description: "Analizza la tua carriera calcistica con metriche avanzate, pattern reali calcolati sui tuoi dati, correlazioni statistiche, storico carriera e molto altro.",
        url: "https://emmepi97.github.io/playerlab-ultimate/"
      }

      
      ,{
        name: "Coach Lab ",
        description: "Monitoraggio risultati, presenze, scouting, analytics, rosa",
        url: " https://emmepi97.github.io/coach-lab/"
      }

      
     , {
        name: "Corto Muso",
        description: "Gioco per pc",
        url: "https://emmepi97.github.io/cortomuso/"
      }

      
     ,{
        name: "Happlytics",
        description: "DA CAPIRE LINK",
        url: "https://emmepi97.github.io/cortomuso/"
      }

      
      ,{
        name: "100 Grid Challenge",
        description: "Gioco per pc",
        url: "https://emmepi97.github.io/100gridchallenge/"
      }

      
      ,{
        name: "Wedding Coding",
        description: "Sito di wdding coding",
        url: "  https://www.weddingcoding.it/"
      }

      
      ,{
        name: "Prio Week",
        description: "App per gestire attività e priorità",
        url: "   https://app-prioro.vercel.app/"
      }


     
    

      
    
    
    
    
    ];

    const appsContainer = document.getElementById("apps");

    apps.forEach(app => {
      const link = document.createElement("a");

      link.className = "app";
      link.href = app.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      link.innerHTML = `
        <div class="app-name">${app.name}</div>
        <div class="app-description">${app.description}</div>
      `;

      appsContainer.appendChild(link);
    });
  </script>

</body>
</html>
