<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --accent-light: #f3f4f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(0,0,0,0.04), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 50px 35px;
    }

    /* =========================
       CONTAINER
       ========================= */

    .container {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 35px;
      gap: 20px;
    }

    .header-left h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
    }

    .project-count {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .project-count strong {
      color: var(--text);
    }

    /* =========================
       GRID
       ========================= */

    .apps {
      display: grid;

      /* 4 ELEMENTI PER RIGA */
      grid-template-columns: repeat(4, minmax(0, 1fr));

      gap: 18px;
    }

    /* =========================
       CARD
       ========================= */

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      min-height: 170px;

      padding: 22px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;

      text-decoration: none;
      color: var(--text);

      overflow: hidden;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.035);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .app::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #111827;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .app:hover {
      transform: translateY(-5px);
      border-color: #d1d5db;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.09);
    }

    .app:hover::before {
      transform: scaleX(1);
    }

    /* =========================
       CARD ICON
       ========================= */

    .app-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--accent-light);
      border-radius: 12px;

      font-size: 19px;
      font-weight: 700;

      margin-bottom: 22px;
    }

    /* =========================
       CARD TEXT
       ========================= */

    .app-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .app-description {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* =========================
       OPEN LINK
       ========================= */

    .app-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 20px;

      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
    }

    .arrow {
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .app:hover .arrow {
      transform: translateX(4px);
      color: var(--text);
    }

    /* =========================
       TABLET
       ========================= */

    @media (max-width: 1100px) {
      .apps {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 750px) {

      body {
        padding: 30px 18px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 25px;
      }

      .header-left h1 {
        font-size: 34px;
      }

      .apps {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .app {
        min-height: 160px;
        padding: 18px;
        border-radius: 15px;
      }

      .app-icon {
        width: 38px;
        height: 38px;
        margin-bottom: 16px;
      }

      .app-name {
        font-size: 16px;
      }

      .app-description {
        font-size: 12px;
      }
    }

    @media (max-width: 450px) {

      .apps {
        grid-template-columns: 1fr;
      }

      .app {
        min-height: 145px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <div class="header-left">
        <h1>My Hub</h1>

        <p class="subtitle">
          I miei progetti e applicazioni web
        </p>
      </div>

      <div class="project-count">
        <strong id="projectCount">0</strong> progetti
      </div>

    </header>


    <div id="apps" class="apps"></div>

  </main>


  <script>

    /*

    */


    const apps = [

      },
      
      ,{
        name: "MrSoccerGamification",

        url: "https://matteopoggesi08.github.io/mrsoccergamification/#/"
      },

      {
        name: "Player Lab Ultimate",
        description: "Monitoraggio della propria carriera calcistica",
        url: "https://emmepi97.github.io/playerlab-ultimate/"
      },

      {
        name: "Football Career",
        description: "NON FUNZIONA PIÙ — DA CAPIRE PERCHÉ E COSA FACESSE",
        url: "https://emmepi97.github.io/footballercareer/"
      },

      {
        name: "Coach Soccer",
        description: "Monitoraggio carichi di lavoro e presenze calcio",
        url: "https://emmepi97.github.io/coachsoccer/"
      },

      {
        name: "Coach Lab",

        url: "https://emmepi97.github.io/coach-lab/"
      },

      {

      },

        name: "Happlytics",

      },

      {
        name: "100 Grid Challenge",

        url: "https://emmepi97.github.io/100gridchallenge/"
      },

      {
        name: "Wedding Coding",

        url: "https://www.weddingcoding.it/"
      },

      {
        name: "Wedding Coding quotation",
        description: "App quotation di wedding coding",
        url: "https://emmepi97.github.io/wedding-coding-quotation-app/"
      },


            {

        url: "https://app-prioro.vercel.app/"
      }

    ];


    /*
    =====================================================
    GENERAZIONE AUTOMATICA DELLE CARD
    =====================================================
    */

    const appsContainer = document.getElementById("apps");

    const projectCount = document.getElementById("projectCount");

    projectCount.textContent = apps.length;


    apps.forEach((app, index) => {

      const link = document.createElement("a");

      link.className = "app";

      link.href = app.url.trim();

      link.target = "_blank";

      link.rel = "noopener noreferrer";


      /*
      Genera una piccola icona numerica
      automaticamente.
      */

      const number = String(index + 1).padStart(2, "0");


      link.innerHTML = `

        <div>

          <div class="app-icon">
            ${number}
          </div>

          <div class="app-name">
            ${app.name}
          </div>

          <div class="app-description">
            ${app.description}
          </div>

        </div>

        <div class="app-footer">

          <span>
            APRI PROGETTO
          </span>

          <span class="arrow">
            →
          </span>

        </div>

      `;


      appsContainer.appendChild(link);

    });

  </script>

</body>
</html>
